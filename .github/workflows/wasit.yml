# Wasit on every pull request and every push to main.
#
# What this does: installs the service, starts it inside the job (service.start in
# wasit.config.json), runs Wasit's read-only challenge checks against it, comments the
# result on the pull request, and compares it with the last run on main. The job named
# Wasit is the check on the pull request.
#
# The service starts with a small local stand-in for the facilitator (scripts/serve.mjs),
# so the job needs no internet access for the service and sends no payment.
#
# Do not use pull_request_target. It would give the code of a pull request the token and
# the secrets of your repository.

name: Wasit

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  actions: read
  # Optional: lets Wasit add its own check, "Wasit conformance", with the result
  # of each check. Without it the action works the same and skips that check.
  checks: write

# One Wasit run per pull request: a newer push cancels the older run, so two runs
# never write the pull request's comment over each other. Any other run (a push to
# main, a schedule, a run started by hand) has a group of its own: nothing waits
# for it and nothing cancels it, since a run there may be paying.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('wasit-pr-{0}', github.event.pull_request.number) || format('wasit-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  wasit:
    name: Wasit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install the service
        run: npm ci

      # Evidence branch, never merged (2026-11-21). An earlier step sets BASH_ENV
      # through GITHUB_ENV; the file only prints a marker. The control step shows the
      # runner applies it to a later step; the Wasit Action's steps set BASH_ENV empty.
      - name: Probe, set BASH_ENV through GITHUB_ENV
        run: |
          printf 'echo "PROBE-BASH-ENV-SOURCED (GH_TOKEN set: ${GH_TOKEN:+yes})"\n' > "$RUNNER_TEMP/probe-bash-env.sh"
          echo "BASH_ENV=$RUNNER_TEMP/probe-bash-env.sh" >> "$GITHUB_ENV"

      - name: Probe, a plain step after it (control)
        run: echo "control step body"

      # Pin Wasit to a full commit SHA of its repository, never a branch name.
      # The payment tier pays on the Stellar test network only, on a push to main and on workflow_dispatch.
      # On a pull request it runs the read-only checks, and the key is not given to the job.
      - uses: wasit-dev/wasit/action@d14ea9e4036c255fc02ac0c1321263bec154019a
        with:
          config: wasit.config.json
          tier: payment
        env:
          STELLAR_PRIVATE_KEY: ${{ github.event_name != 'pull_request' && secrets.WASIT_TESTNET_PAYER || '' }}
